name: Flutter Mobile

on:
  push:
    branches:
      - main
      - master
      - review-fix
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to the android-latest GitHub Release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.4
  ACE_API_BASE_URL: ${{ vars.ACE_API_BASE_URL || secrets.ACE_API_BASE_URL }}

jobs:
  flutter_checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android_release:
    runs-on: ubuntu-latest
    needs: flutter_checks
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release keystore
        env:
          ACE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ACE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ACE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ACE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ace-studio-release.jks"
          fi

      - name: Build APK (release)
        env:
          ACE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ace-studio-release.jks
          ACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACE_ANDROID_KEYSTORE_PASSWORD }}
          ACE_ANDROID_KEY_ALIAS: ${{ secrets.ACE_ANDROID_KEY_ALIAS }}
          ACE_ANDROID_KEY_PASSWORD: ${{ secrets.ACE_ANDROID_KEY_PASSWORD }}
        run: |
          API_BASE_URL="${ACE_API_BASE_URL:-https://www.acestudio.ng}"
          flutter build apk --release --android-skip-build-dependency-validation \
            --dart-define=ACE_API_BASE_URL=$API_BASE_URL \
            --dart-define=ACE_ENVIRONMENT=production \
            --dart-define=ACE_IOS_BUNDLE_ID=ng.acestudio.mobile

      - name: Stop Gradle after APK build
        if: always()
        run: ./android/gradlew --stop || true

      - name: Build App Bundle (release)
        env:
          ACE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ace-studio-release.jks
          ACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACE_ANDROID_KEYSTORE_PASSWORD }}
          ACE_ANDROID_KEY_ALIAS: ${{ secrets.ACE_ANDROID_KEY_ALIAS }}
          ACE_ANDROID_KEY_PASSWORD: ${{ secrets.ACE_ANDROID_KEY_PASSWORD }}
        run: |
          API_BASE_URL="${ACE_API_BASE_URL:-https://www.acestudio.ng}"
          flutter build appbundle --release --android-skip-build-dependency-validation \
            --dart-define=ACE_API_BASE_URL=$API_BASE_URL \
            --dart-define=ACE_ENVIRONMENT=production \
            --dart-define=ACE_IOS_BUNDLE_ID=ng.acestudio.mobile

      - name: Prepare release files
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/ace-studio-android.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release/ace-studio-android.aab

      - name: Detect APK R2 storage configuration
        id: storage
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "R2 secrets are not configured. APK build will continue and GitHub release publishing can still succeed."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Upload APK to R2
        if: steps.storage.outputs.configured == 'true'
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_REGION: ${{ secrets.R2_REGION }}
          ACE_ANDROID_APK_R2_KEY: ${{ vars.ACE_ANDROID_APK_R2_KEY }}
        run: |
          node ../scripts/upload-android-apk-to-r2.mjs build/release/ace-studio-android.apk

      # Artifact uploads disabled to avoid GitHub storage quota limits.
      # Re-enable only when needed (e.g. for release debugging).
      # - name: Upload APK artifact
      #   if: false
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ace-flutter-release-apk
      #     path: ace_flutter/build/release/ace-studio-android.apk

      # - name: Upload AAB artifact
      #   if: false
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ace-flutter-release-aab
      #     path: ace_flutter/build/release/ace-studio-android.aab

      - name: Publish Android release
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true') }}
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: ACE Studio Android Latest
          body: "Latest direct-download Android APK for ACE Studio."
          artifacts: "ace_flutter/build/release/ace-studio-android.apk,ace_flutter/build/release/ace-studio-android.aab"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

  ios_release:
    runs-on: macos-latest
    needs: flutter_checks
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare iOS signing assets
        id: ios_signing
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILEPROVISION_BASE64: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] || [ -z "$IOS_MOBILEPROVISION_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "signing_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CERT_PATH="$RUNNER_TEMP/ace-ios-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/ace-ios.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/ace-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_MOBILEPROVISION_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/ace-ios-profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/ace-ios-profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/ace-ios-profile.plist")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD:-app-store}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>compileBitcode</key>
            <false/>
            <key>provisioningProfiles</key>
            <dict>
              <key>ng.acestudio.mobile</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          echo "signing_ready=true" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$KEYCHAIN_PATH" >> "$GITHUB_OUTPUT"

      - name: Skip iOS release when signing is unavailable
        if: ${{ steps.ios_signing.outputs.signing_ready != 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        run: |
          echo "iOS signing assets are not configured, so the iOS IPA release is skipped. Android release artifacts can still be built and uploaded."

      - name: Build signed iOS IPA
        if: steps.ios_signing.outputs.signing_ready == 'true'
        env:
          ACE_IOS_BUNDLE_ID: ng.acestudio.mobile
        run: |
          API_BASE_URL="${ACE_API_BASE_URL:-https://www.acestudio.ng}"
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --dart-define=ACE_API_BASE_URL=$API_BASE_URL \
            --dart-define=ACE_ENVIRONMENT=production \
            --dart-define=ACE_IOS_BUNDLE_ID=$ACE_IOS_BUNDLE_ID

      - name: Build unsigned iOS app
        if: ${{ steps.ios_signing.outputs.signing_ready != 'true' && github.event_name == 'pull_request' }}
        env:
          ACE_IOS_BUNDLE_ID: ng.acestudio.mobile
        run: |
          API_BASE_URL="${ACE_API_BASE_URL:-https://www.acestudio.ng}"
          flutter build ios --release --no-codesign \
            --dart-define=ACE_API_BASE_URL=$API_BASE_URL \
            --dart-define=ACE_ENVIRONMENT=production \
            --dart-define=ACE_IOS_BUNDLE_ID=$ACE_IOS_BUNDLE_ID

      # Artifact uploads disabled to avoid GitHub storage quota limits.
      # - name: Upload signed iOS IPA artifact
      #   if: false
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ace-flutter-ios-release-ipa
      #     path: ace_flutter/build/ios/ipa/*.ipa

      # - name: Upload unsigned iOS app artifact
      #   if: false
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: ace-flutter-ios-release-app-unsigned
      #     path: ace_flutter/build/ios/iphoneos/Runner.app

      - name: Cleanup iOS signing keychain
        if: always() && steps.ios_signing.outputs.signing_ready == 'true'
        run: |
          security delete-keychain "${{ steps.ios_signing.outputs.keychain_path }}" || true
