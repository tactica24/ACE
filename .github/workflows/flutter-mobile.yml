name: Flutter Mobile

on:
  push:
    branches:
      - main
      - master
      - review-fix
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish APK to the android-latest GitHub Release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  flutter_checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android_release:
    runs-on: ubuntu-latest
    needs: flutter_checks
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Android release keystore
        env:
          ACE_ANDROID_KEYSTORE_BASE64: ${{ secrets.ACE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ACE_ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ACE_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ace-studio-release.jks"
          fi

      - name: Build APK (release)
        env:
          ACE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ace-studio-release.jks
          ACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACE_ANDROID_KEYSTORE_PASSWORD }}
          ACE_ANDROID_KEY_ALIAS: ${{ secrets.ACE_ANDROID_KEY_ALIAS }}
          ACE_ANDROID_KEY_PASSWORD: ${{ secrets.ACE_ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --android-skip-build-dependency-validation
          --dart-define=ACE_API_BASE_URL=https://www.acestudio.ng
          --dart-define=ACE_ENVIRONMENT=production
          --dart-define=ACE_FIREBASE_API_KEY=${{ secrets.ACE_FIREBASE_API_KEY }}
          --dart-define=ACE_FIREBASE_APP_ID=${{ secrets.ACE_FIREBASE_APP_ID }}
          --dart-define=ACE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.ACE_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=ACE_FIREBASE_PROJECT_ID=${{ secrets.ACE_FIREBASE_PROJECT_ID }}
          --dart-define=ACE_FIREBASE_AUTH_DOMAIN=${{ secrets.ACE_FIREBASE_AUTH_DOMAIN }}
          --dart-define=ACE_FIREBASE_STORAGE_BUCKET=${{ secrets.ACE_FIREBASE_STORAGE_BUCKET }}
          --dart-define=ACE_IOS_BUNDLE_ID=ng.acestudio.mobile

      - name: Build App Bundle (release)
        env:
          ACE_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ace-studio-release.jks
          ACE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ACE_ANDROID_KEYSTORE_PASSWORD }}
          ACE_ANDROID_KEY_ALIAS: ${{ secrets.ACE_ANDROID_KEY_ALIAS }}
          ACE_ANDROID_KEY_PASSWORD: ${{ secrets.ACE_ANDROID_KEY_PASSWORD }}
        run: >
          flutter build appbundle --release --android-skip-build-dependency-validation
          --dart-define=ACE_API_BASE_URL=https://www.acestudio.ng
          --dart-define=ACE_ENVIRONMENT=production
          --dart-define=ACE_FIREBASE_API_KEY=${{ secrets.ACE_FIREBASE_API_KEY }}
          --dart-define=ACE_FIREBASE_APP_ID=${{ secrets.ACE_FIREBASE_APP_ID }}
          --dart-define=ACE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.ACE_FIREBASE_MESSAGING_SENDER_ID }}
          --dart-define=ACE_FIREBASE_PROJECT_ID=${{ secrets.ACE_FIREBASE_PROJECT_ID }}
          --dart-define=ACE_FIREBASE_AUTH_DOMAIN=${{ secrets.ACE_FIREBASE_AUTH_DOMAIN }}
          --dart-define=ACE_FIREBASE_STORAGE_BUCKET=${{ secrets.ACE_FIREBASE_STORAGE_BUCKET }}
          --dart-define=ACE_IOS_BUNDLE_ID=ng.acestudio.mobile

      - name: Prepare release files
        run: |
          mkdir -p build/release
          cp build/app/outputs/flutter-apk/app-release.apk build/release/ace-studio-android.apk
          cp build/app/outputs/bundle/release/app-release.aab build/release/ace-studio-android.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-release-apk
          path: ace_flutter/build/release/ace-studio-android.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-release-aab
          path: ace_flutter/build/release/ace-studio-android.aab

      - name: Publish Android release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: android-latest
          name: ACE Studio Android Latest
          body: "Latest direct-download Android APK for ACE Studio."
          artifacts: "ace_flutter/build/release/ace-studio-android.apk,ace_flutter/build/release/ace-studio-android.aab"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true

  ios_release:
    runs-on: macos-latest
    needs: flutter_checks
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-ios-release-app
          path: ace_flutter/build/ios/iphoneos/Runner.app
