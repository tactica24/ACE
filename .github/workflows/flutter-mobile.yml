name: Flutter Mobile

on:
  push:
    branches:
      - main
      - master
      - review-fix
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  pull_request:
    paths:
      - "ace_flutter/**"
      - ".github/workflows/flutter-mobile.yml"
  workflow_dispatch:

jobs:
  flutter_checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android_release:
    runs-on: ubuntu-latest
    needs: flutter_checks
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build App Bundle (release)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-release-apk
          path: ace_flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-release-aab
          path: ace_flutter/build/app/outputs/bundle/release/app-release.aab

  ios_release:
    runs-on: macos-latest
    needs: flutter_checks
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ace-flutter-ios-release-app
          path: ace_flutter/build/ios/iphoneos/Runner.app
