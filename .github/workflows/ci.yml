name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  web-quality:
    name: Web lint + typecheck + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace
          POSTGRES_DB: ace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d ace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MOCK_BUNNY: "1"
      DATABASE_URL: postgresql://ace:ace@localhost:5432/ace?schema=public
      DIRECT_URL: postgresql://ace:ace@localhost:5432/ace?schema=public
      ACE_STREAM_SIGNING_SECRET: test-signing-secret
      ADMIN_SEED_PASSWORD: TestAdmin1!
      CREATOR_SEED_PASSWORD: TestCreator1!
      USER_SEED_PASSWORD: TestUser1!
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Database push
        run: npx prisma db push --skip-generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Coverage gate
        run: npm run test:coverage

  flutter-quality:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ace_flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
