name: Collect live match drafts

on:
  schedule:
    # GitHub cron uses UTC. 09:00-20:00 UTC is 10:00-21:00 in Lagos (WAT).
    - cron: '0 9-20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-live-match-drafts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask ACE to collect approved YouTube broadcasts
        env:
          CRON_SECRET: ${{ secrets.ACE_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://acestudio.ng/api/cron/collect-live-matches
