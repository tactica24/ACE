name: Bootstrap Production

on:
  workflow_dispatch:
    inputs:
      seed_defaults:
        description: "Seed default admin, creator, viewer, and sample titles"
        required: true
        default: true
        type: boolean

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.DATABASE_URL }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
      FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync production schema
        run: npm run db:push

      - name: Seed default data
        if: ${{ inputs.seed_defaults }}
        run: npm run db:seed
