name: Bootstrap Production

on:
  workflow_dispatch:
    inputs:
      seed_defaults:
        description: "Seed default admin, creator, viewer, and sample titles"
        required: true
        default: true
        type: boolean

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run production migrations
        run: npm run db:migrate:deploy

      - name: Seed default data
        if: ${{ inputs.seed_defaults }}
        run: npm run db:seed
