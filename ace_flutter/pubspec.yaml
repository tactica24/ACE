name: ace_studio_flutter
description: Premium Flutter viewer app for ACE Studio.
publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  http: ^1.2.2
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  video_player: ^2.14.0
  cached_network_image: ^3.4.1
  pointycastle: ^3.9.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
